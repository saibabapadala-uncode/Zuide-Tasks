<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Zuide Tasks</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #09090b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container { text-align: center; max-width: 340px; }
    .logo {
      width: 72px; height: 72px;
      background: #4f46e5;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 8px 24px rgba(79,70,229,0.25);
    }
    .logo svg { width: 40px; height: 40px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 10px; }
    p { font-size: 14px; color: #71717a; line-height: 1.65; margin-bottom: 28px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #4f46e5; color: white;
      border: none; padding: 12px 28px;
      border-radius: 10px; font-size: 14px;
      font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #4338ca; }
    @media (prefers-color-scheme: dark) {
      body { background: #09090b; color: #f4f4f5; }
      p { color: #71717a; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
        <polyline points="110,128 402,128 110,384 402,384"
          stroke="white" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>It looks like you've lost your internet connection. Check your network settings and try again.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.85"/>
      </svg>
      Try Again
    </button>
  </div>
</body>
</html>
